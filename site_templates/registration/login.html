{% extends "focused.html" %}
{% load crispy_forms_tags %}


{% block title %}Sign In{% endblock %}


{% block breadcrumbs %}{{ block.super }}<li class="breadcrumb-item active" aria-current="page">Sign In</li>{% endblock %}



{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
        <div class="card">
            <div class="card-header">
                <h1>Sign In</h1>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-primary">Sign In</button>
                    <a href="{% url 'users:password_reset' %}" class="btn btn-link">Forgot Password?</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
